services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_electronic_documents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
    ports:
      - "54321:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_electronic_documents"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: