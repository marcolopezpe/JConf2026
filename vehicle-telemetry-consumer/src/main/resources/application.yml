application:
  kafka-values:
    topic: vehicle-telemetry-topic
    bootstrap-servers: localhost:9092
    schema:
      registry:
        url: http://localhost:8081
        auto-register: false
        use-latest-version: true
    consumer:
      group-id: ${CONSUMER_GROUP_ID:vehicle-telemetry-cg01}
      client-id: ${CONSUMER_CLIENT_ID:vehicle-telemetry-cid01}
      max-poll-records: ${MAX_POLL_RECORDS:500}
      avro:
        reader: true
      auto:
        offset:
          reset: earliest
      enable:
        auto:
          commit: false
  internal-values:
    retries: 3
    semaphore:
      permits: ${VT_WORKERS:1}
  telemetry:
    persistence:
      mode: ${TELEMETRY_MODE:single} # single | batch | copy
    concurrency:
      virtual-threads: ${VIRTUAL_THREADS:false}
      chunk-size: ${VT_CHUNK_SIZE:100}
    retry:
      initial-backoff-ms: 1000
      max-backoff-ms: 15000
    benchmark:
      idle-timeout-ms: 5000 # sin mensajes durante este tiempo = fin de la corrida
    batch:
      size: 500
    dlq:
      enabled: ${DLQ_ENABLED:true}
      topic: ${DLQ_TOPIC:vehicle-telemetry-dlq}
      send-timeout-ms: ${DLQ_SEND_TIMEOUT_MS:10000}

quarkus:
  http:
    port: 8101
  devservices:
    enabled: false
  kafka:
    devservices:
      enabled: false
  datasource:
    db-kind: postgresql
    username: postgres
    password: 123456789
    jdbc:
      # connectTimeout/loginTimeout/socketTimeout en segundos: ninguna espera queda bloqueada para siempre.
      # tcpKeepAlive detecta conexiones que un firewall o NAT cortó en silencio.
      url: jdbc:postgresql://localhost:5431/db_vehicle_telemetry?connectTimeout=5&loginTimeout=5&socketTimeout=60&tcpKeepAlive=true
      max-size: ${JDBC_POOL_SIZE:1}
      acquisition-timeout: 10
      # Descartar conexiones muertas en lugar de entregarlas:
      validation-query-sql: SELECT 1
      background-validation-interval: 10S   # revisa conexiones en reposo cada 10 s (por defecto 2M)
      foreground-validation-interval: 1S    # al pedir una conexión que estuvo ociosa >1 s, la valida antes
      max-lifetime: 30M                     # recicla conexiones viejas
  hibernate-orm:
    log:
      sql: false
      format-sql: false
    database:
      generation: none